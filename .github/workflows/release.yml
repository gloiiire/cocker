name: Release

# Triggered on tag push (v*) — builds the release binaries, signs them with
# cosign keyless OIDC (no private keys to manage), uploads them and the
# signatures as GitHub release assets.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # gh release create / upload
  id-token: write   # cosign keyless via GitHub OIDC
  attestations: write

jobs:
  # Nothing gets built, signed, attested or published until the tests pass on
  # the exact commit being tagged.
  #
  # Until now this workflow ran no tests at all. A tag could be built, cosign-
  # signed, SLSA-attested, bottled and pushed to the Homebrew tap without
  # `swift test` ever running against it — the CI workflow only fires on
  # pushes and pull requests, so a tag pushed straight at a commit was
  # published unverified. That is the opposite of what a signature is for.
  test:
    name: Tests must pass on the tagged commit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-release-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-release-spm-
            ${{ runner.os }}-spm-

      - name: swift test
        run: swift test --parallel

      # The guest init is cross-compiled and never covered by `swift test`.
      # It shipped broken once already (0.7.13.13 packaged a stale binary),
      # so at minimum prove it still builds warning-free for the target and
      # that its own C tests pass.
      - name: Install zig
        run: brew install zig

      - name: Build and test cocker-init
        working-directory: cocker-init
        run: |
          zig cc -target aarch64-linux-musl -static -O2 -Wall \
            -o cocker-init init.c cmdline.c net.c dns_proxy.c spec.c qemu.c \
            exec_listener.c caps.c health_poll.c etc_overlay.c dhcp_min.c
          file cocker-init | grep -q 'ARM aarch64' \
            || { echo "::error::cocker-init is not an aarch64 ELF"; exit 1; }
          cc -O1 -Wall -o test_exec_parser tests/test_exec_parser_order.c \
            && ./test_exec_parser

  build-and-sign:
    name: Build & sign release artifacts
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Single source of truth gate (charter §release-runbook).
      # Refuses to ship a release if the tag (vX.Y.Z), the /VERSION file,
      # the CockerVersion.version Swift constant, or the Formula version
      # disagree. This is the safety net behind scripts/bump-version.sh —
      # if a maintainer hand-edits one of the files and forgets the
      # others, the release fails before any binaries are built.
      - name: Assert version sync (tag ↔ VERSION ↔ Swift ↔ Formula)
        run: |
          tag="${GITHUB_REF_NAME#v}"          # strip leading "v"
          version_file=$(tr -d '[:space:]' < VERSION)
          swift_version=$(grep -oE 'public static let version = "[^"]+"' \
              Sources/CockerCore/IPC/Protocol.swift | sed -E 's/.*"([^"]+)"/\1/')
          formula_version=$(grep -oE '^  version "[^"]+"' \
              Formula/cocker.rb | sed -E 's/.*"([^"]+)"/\1/')

          echo "tag             = $tag"
          echo "VERSION file    = $version_file"
          echo "Swift constant  = $swift_version"
          echo "Formula version = $formula_version"

          fail=0
          for v in "$version_file" "$swift_version" "$formula_version"; do
              if [ "$v" != "$tag" ]; then fail=1; fi
          done
          if [ $fail -ne 0 ]; then
              echo "::error::version mismatch — run \`./scripts/bump-version.sh $tag\`"
              echo "        on dev, merge dev → main, then re-tag."
              exit 1
          fi
          echo "✓ all four version anchors agree on $tag"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      # Cache SwiftPM artifacts so successive tag releases (and the rebuilt
      # bottle workflow that follows) don't recompile the whole dep graph
      # from scratch. Key on Package.resolved : a deps bump invalidates,
      # everything else hits. Saves ~3 min off the swift build below.
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-release-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-release-spm-
            ${{ runner.os }}-spm-

      - name: Build release binaries
        run: |
          swift build -c release --disable-sandbox
          mkdir -p dist
          cp .build/release/cocker dist/cocker-${{ github.ref_name }}-arm64-macos
          cp .build/release/cockerd dist/cockerd-${{ github.ref_name }}-arm64-macos
          cp .build/release/cocker-portfwd dist/cocker-portfwd-${{ github.ref_name }}-arm64-macos
          cp .build/release/cocker-mcp dist/cocker-mcp-${{ github.ref_name }}-arm64-macos
          ls -la dist/

      - name: Cross-compile cocker-init for Linux ARM64
        run: |
          brew install zig
          cd cocker-init
          zig cc -target aarch64-linux-musl -static -O2 -Wall -o cocker-init \
                 init.c cmdline.c net.c dns_proxy.c spec.c qemu.c \
                 exec_listener.c caps.c health_poll.c etc_overlay.c dhcp_min.c
          cp cocker-init initrd-staging/init
          chmod 0755 initrd-staging/init
          (cd initrd-staging && find . | cpio -o -H newc 2>/dev/null) \
            | gzip -9 > initrd.img
          cp cocker-init ../dist/cocker-init-${{ github.ref_name }}-aarch64-linux
          cp initrd.img ../dist/initrd-${{ github.ref_name }}.img

      - name: Compute SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign each binary with cosign (keyless OIDC)
        # Each .sig + .crt gets uploaded next to the binary. Verification :
        #   cosign verify-blob --certificate=cocker.crt --signature=cocker.sig \
        #     --certificate-identity-regexp='https://github.com/gloiiire/cocker/.*' \
        #     --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
        #     cocker
        run: |
          cd dist
          for f in cocker-* cockerd-* initrd-* SHA256SUMS; do
            [ -f "$f" ] || continue
            echo "Signing $f"
            COSIGN_EXPERIMENTAL=1 cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.crt" \
              "$f"
          done
          ls -la

      # The release object was already created by the human who pushed
      # the tag (or by an earlier `gh release create`). Create a
      # placeholder via REST if it isn't there yet, then upload assets
      # via curl directly against uploads.github.com — `gh release
      # upload` here returns 401 even with a valid GITHUB_TOKEN (a
      # known gh-CLI / runner-token quirk that surfaces irregularly).
      - name: Attach assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          # Ensure the release exists. `tags/<TAG>` returns 404 if not.
          if ! curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Signed release artifacts attached by CI.\"}" >/dev/null
          fi
          REL_JSON=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          UP_TMPL=$(echo "$REL_JSON" | jq -r '.upload_url')
          UP_BASE="${UP_TMPL%\{*\}}"
          REL_ID=$(echo "$REL_JSON" | jq -r '.id')

          for f in dist/*; do
            name=$(basename "$f")
            # Clobber any existing asset with the same name (idempotent re-runs).
            EXISTING=$(echo "$REL_JSON" | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id // empty')
            if [ -n "$EXISTING" ]; then
              curl -fsS -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/releases/assets/$EXISTING" >/dev/null
            fi
            echo "uploading $name"
            # Pick a content type from the filename ; release uploads
            # tolerate octet-stream but signature verification on the
            # consumer side prefers the right mime.
            case "$name" in
              *.tar.gz|*.tgz) ctype="application/gzip" ;;
              *.img)          ctype="application/octet-stream" ;;
              *.sig|*.crt)    ctype="text/plain" ;;
              *)              ctype="application/octet-stream" ;;
            esac
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $ctype" \
              --data-binary @"$f" \
              "${UP_BASE}?name=${name}" >/dev/null
          done

      - name: Generate SLSA provenance attestation
        # GitHub-native attestations link the artifact to the workflow run that
        # produced it ; verifiable via `gh attestation verify`.
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/cocker*,dist/cockerd*,dist/initrd*'
