name: Bottle

# Build Homebrew bottles for cocker. A "bottle" is a pre-compiled
# binary tarball that brew downloads instead of `swift build` on the
# user's machine — install drops from ~3 min to ~5s.
#
# Strategy : repack the artifacts that the Release workflow already
# uploaded, rather than calling `brew install --build-bottle` (which
# would `swift build` from scratch a SECOND time on each matrix
# entry). The arm64 cocker binary is identical across every macOS
# version, so we repack it into a SINGLE bottle tagged `all` (one
# tarball, one sha256) from one Cellar staging dir on a fast Ubuntu
# runner — Homebrew's `all` tag then matches any macOS, present or
# future, with no per-OS symbol to maintain.
#
# Wins vs. the old `brew install --build-bottle` matrix :
#   - No macOS runner provisioning (~2 min/runner × 3 → 0).
#   - No second `swift build` (~5 min/runner × 3 → 0).
#   - Single Ubuntu job, ~1 min total versus ~15 min.
#
# Triggered AFTER the Release workflow uploads its arm64-macos
# binaries, since we depend on them as source material.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bottle (e.g. v0.5.14.1)'
        required: true

permissions:
  contents: write   # upload bottle assets + push formula update

jobs:
  bottle:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      # Validate RELEASE_PUSH_TOKEN BEFORE we burn 5 min building bottles.
      # Reports which capability failed so we can tell the difference
      # between "token expired / missing", "wrong scope", and "no write
      # to this repo".
      - name: Validate RELEASE_PUSH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_PUSH_TOKEN secret is missing"
            exit 1
          fi
          # 1. Token recognized at all ? /user is the cheapest authenticated endpoint.
          HTTP_USER=$(curl -sS -o /tmp/user.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user)
          echo "GET /user → HTTP $HTTP_USER"
          if [ "$HTTP_USER" != "200" ]; then
            echo "::error::Token failed /user check — token is invalid, expired, or revoked."
            cat /tmp/user.json
            exit 1
          fi
          LOGIN=$(jq -r '.login' /tmp/user.json)
          echo "Authenticated as: $LOGIN"
          # 2. Read access to repo ?
          HTTP_REPO=$(curl -sS -o /tmp/repo.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}")
          echo "GET /repos/${{ github.repository }} → HTTP $HTTP_REPO"
          if [ "$HTTP_REPO" != "200" ]; then
            echo "::error::Token can't read ${{ github.repository }} — repo not in PAT scope."
            cat /tmp/repo.json
            exit 1
          fi
          # 3. Write access ? Try a dry PUT (with a deliberately wrong file sha
          # so it returns 409, NOT 200 — 401/403 means no write perm.
          HTTP_PUT=$(curl -sS -o /tmp/put.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/Formula/cocker.rb" \
            -d '{"message":"preflight","content":"","sha":"0000000000000000000000000000000000000000","branch":"main"}')
          echo "PUT /contents (dry) → HTTP $HTTP_PUT"
          case "$HTTP_PUT" in
            409|422) echo "Write capability confirmed (dry write rejected for content reason, not auth)." ;;
            401)     echo "::error::PUT 401 — token does not have Contents: write on this repo."; cat /tmp/put.json; exit 1 ;;
            403)     echo "::error::PUT 403 — write perm OK but blocked. Bypass actor / branch protection issue."; cat /tmp/put.json; exit 1 ;;
            *)       echo "::warning::Unexpected PUT preflight HTTP $HTTP_PUT — investigate."; cat /tmp/put.json ;;
          esac

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          VER="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout cocker @ tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # No `fetch-depth: 0` — we only need the tag's snapshot, not
          # the history. Saves ~10s on big-repo clones.

      # Pull the binaries the Release workflow already built, signed,
      # and uploaded as release assets. Plain curl against the public
      # `releases/download/<tag>/<name>` URL instead of
      # `gh release download` — the latter currently 401s on
      # GitHub-hosted runners even with a valid GITHUB_TOKEN (known
      # gh-CLI / runner-token quirk that surfaces irregularly). cocker
      # is a public repo so unauthenticated curl works.
      - name: Download Release artifacts
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          mkdir -p artifacts
          cd artifacts
          for asset in \
            "cocker-${TAG}-arm64-macos" \
            "cockerd-${TAG}-arm64-macos" \
            "cocker-portfwd-${TAG}-arm64-macos" \
            "cocker-mcp-${TAG}-arm64-macos" \
            "initrd-${TAG}.img"
          do
            echo "downloading $asset"
            curl -fsSL -o "$asset" "${BASE}/${asset}"
          done
          ls -la

      # Reconstruct the Cellar layout `brew bottle` would have built,
      # plus the INSTALL_RECEIPT.json that brew requires to recognize
      # the tarball as a valid bottle at pour time. Then tar.gz three
      # named copies (tahoe / sequoia / sonoma) — the bytes are
      # identical but each OS tag needs its own asset because the
      # formula's `bottle do` block matches on filename.
      - name: Assemble Cellar layout
        id: assemble
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${{ steps.tag.outputs.version }}"

          ROOT="bottle-staging/cocker/${VER}"
          mkdir -p "$ROOT/bin" "$ROOT/share/cocker"

          # Drop the v-prefix from binary filenames as they land in
          # ${PREFIX}/bin/. INSTALL_RECEIPT.json + symlinks created by
          # brew at pour time will then point to bare names.
          mv "artifacts/cocker-${TAG}-arm64-macos"         "$ROOT/bin/cocker"
          mv "artifacts/cockerd-${TAG}-arm64-macos"        "$ROOT/bin/cockerd"
          mv "artifacts/cocker-portfwd-${TAG}-arm64-macos" "$ROOT/bin/cocker-portfwd"
          mv "artifacts/cocker-mcp-${TAG}-arm64-macos"     "$ROOT/bin/cocker-mcp"
          chmod +x "$ROOT/bin/"*

          # initrd + entitlements live under share/cocker/ ; they're
          # consumed by post_install + at daemon boot time.
          mv "artifacts/initrd-${TAG}.img" "$ROOT/share/cocker/initrd.img"
          cp "entitlements/cockerd.entitlements" "$ROOT/share/cocker/"

          # Man pages : ship them if the source tarball has them
          # pre-generated under docs/man/, else skip (the formula's
          # source-build path can still regenerate them).
          if [ -d docs/man ]; then
            mkdir -p "$ROOT/share/man/man1"
            cp docs/man/*.1 "$ROOT/share/man/man1/" 2>/dev/null || true
          fi

          # Kiro / Fig autocomplete spec — staged under share/ so the
          # Formula's post_install can drop it into the user's
          # ~/.fig/autocomplete/build/ when Kiro is detected. The
          # `(share/...).install` lines in Formula/cocker.rb only run
          # for source builds ; bottle pours skip `def install` and
          # rely on whatever is baked into this tarball.
          #
          # Kiro reads compiled ES-module .js files, not raw .ts, so we
          # run the official @withfig/autocomplete-tools to produce the
          # right format. The .ts source is shipped alongside for
          # discoverability / diffs / future upstream submission.
          if [ -d completions/kiro ]; then
            mkdir -p "$ROOT/share/cocker/completions/kiro"
            cp completions/kiro/cocker.ts "$ROOT/share/cocker/completions/kiro/" 2>/dev/null || true
            cp completions/kiro/README.md "$ROOT/share/cocker/completions/kiro/" 2>/dev/null || true

            # Compile to the .js format Kiro actually loads. autocomplete-
            # tools expects a src/ layout, so we shuffle into a temp dir,
            # build, and copy the .js back.
            BUILD_TMP=$(mktemp -d)
            mkdir -p "$BUILD_TMP/src"
            cp completions/kiro/cocker.ts "$BUILD_TMP/src/"
            (
              cd "$BUILD_TMP"
              npx -y @withfig/autocomplete-tools@latest compile --outdir build
            )
            if [ -f "$BUILD_TMP/build/cocker.js" ]; then
              cp "$BUILD_TMP/build/cocker.js" "$ROOT/share/cocker/completions/kiro/"
            else
              echo "::warning::cocker.js compile failed — bottle will ship only the .ts (Kiro users will need a manual compile)."
            fi
            rm -rf "$BUILD_TMP"
          fi

          # INSTALL_RECEIPT.json — minimum brew accepts to pour the
          # bottle. The fields that actually matter to brew :
          #   - built_as_bottle = true
          #   - source.versions.stable = the formula version
          #   - source.tap = our tap
          #   - arch = arm64
          # built_on.os_version is informational, brew doesn't gate on
          # it. We pin macOS 14.0 (our minimum) so brew never refuses
          # a Sonoma user.
          # Reproducible bottle requires deterministic file content.
          # `date +%s` baked the current epoch into INSTALL_RECEIPT.json
          # at build time, so two Bottle runs of the same input produced
          # DIFFERENT files (and sha256s), even with --sort + --mtime on
          # tar. Pin the timestamp ; brew never gates on this field's
          # value, it's purely informational.
          BUILT_TIME=1735689600  # 2025-01-01 00:00:00 UTC
          cat > "$ROOT/INSTALL_RECEIPT.json" <<JSON
          {
            "homebrew_version": "4.0.0",
            "used_options": [],
            "unused_options": [],
            "built_as_bottle": true,
            "poured_from_bottle": false,
            "loaded_from_api": false,
            "installed_as_dependency": false,
            "installed_on_request": true,
            "changed_files": [],
            "time": ${BUILT_TIME},
            "source_modified_time": ${BUILT_TIME},
            "stdlib": null,
            "compiler": "clang",
            "aliases": [],
            "runtime_dependencies": [],
            "source": {
              "spec": "stable",
              "patches": [],
              "tap": "gloiiire/cocker",
              "versions": {
                "stable": "${VER}"
              }
            },
            "arch": "arm64",
            "built_on": {
              "os": "Macintosh",
              "os_version": "macOS 14.0",
              "cpu_family": "arm_vortex_tempest"
            }
          }
          JSON

          # Build ONE bottle tagged `all`. The arm64 binary is
          # byte-identical across macOS versions, so a single `all:`
          # bottle matches every macOS — Sonoma, Tahoe, and any future
          # release — via Homebrew's `all` tag. No per-OS matrix, and no
          # per-OS symbol to add when a new macOS ships (that's the whole
          # point : macOS 27+ "just works" with no formula change).
          # Filename uses the bare version (no `v` prefix) because brew
          # computes the bottle filename from the formula's `version`
          # string, NOT from any tag/url. Earlier a `v` prefix caused a
          # 404 : brew asked for `cocker-0.5.14.3.all.bottle.tar.gz` but
          # we'd uploaded `cocker-v0.5.14.3...`.
          # Reproducible tarball : identical input bytes must produce an
          # identical sha256, otherwise a Bottle re-run (e.g. the upstream
          # Release retried) overwrites the released file with a NEW sha
          # while the previous run's sha is already baked into Formula on
          # main → brew gets a checksum mismatch at install time. Pins :
          #   --sort=name              deterministic entry order
          #   --mtime, --owner, --group fixed values, not the runner's
          #                            ctime / uid / gid
          #   gzip -n                  strip the gzip mtime+filename
          #                            header so the .gz envelope is
          #                            also bit-identical.
          mkdir -p out
          NAME="cocker-${VER}.all.bottle.tar.gz"
          tar -C bottle-staging --sort=name \
              --mtime='2025-01-01 00:00:00 UTC' \
              --owner=0 --group=0 --numeric-owner \
              -cf - "cocker/${VER}" \
            | gzip -9 -n > "out/${NAME}"
          SHA=$(sha256sum "out/${NAME}" | awk '{print $1}')
          echo "sha_all=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Built ${NAME}"
          echo "  sha256 ${SHA}"
          ls -la out/

      # Upload via REST API directly — `gh release upload` 401s on
      # GitHub-hosted runners with valid GITHUB_TOKEN intermittently.
      # Raw curl to uploads.github.com works because we control the
      # Bearer token explicitly.
      - name: Upload bottles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REL_JSON=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")
          UP_TMPL=$(echo "$REL_JSON" | jq -r '.upload_url')
          UP_BASE="${UP_TMPL%\{*\}}"
          for f in out/*.bottle.tar.gz; do
            name=$(basename "$f")
            # Idempotency : delete any existing asset with the same name
            # before re-uploading (matches the `--clobber` semantics of
            # the `gh release upload` we replaced).
            EXISTING=$(echo "$REL_JSON" | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .id // empty')
            if [ -n "$EXISTING" ]; then
              curl -fsS -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$EXISTING" >/dev/null
            fi
            echo "uploading $name"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/gzip" \
              --data-binary @"$f" \
              "${UP_BASE}?name=${name}" >/dev/null
          done

      # Patch the source formula's bottle do block with the actual
      # sha256s we just computed. Commit on main via GitHub's contents
      # API — that path produces a signed commit (the "GitHub
      # web-flow" signer) which satisfies main's `required_signatures`
      # rule. The PAT (RELEASE_PUSH_TOKEN, fine-grained on
      # gloiiire/cocker with Contents R/W) is the admin user's token,
      # so it bypasses `pull_request` and `required_status_checks` via
      # the `RepositoryRole=admin` entry in main's ruleset
      # bypass_actors. `git push` would fail because github-actions[bot]
      # cannot sign and isn't in bypass_actors on a personal repo.
      - name: Rewrite Formula sha256s and commit (signed, via API)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ steps.tag.outputs.tag }}"
          SHA_ALL="${{ steps.assemble.outputs.sha_all }}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_PUSH_TOKEN secret is not set."
            echo "Generate a fine-grained PAT for ${REPO} with Contents: Read and write"
            echo "and store it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Fetch current main Formula
          FILE_META=$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/contents/Formula/cocker.rb?ref=main")
          FILE_SHA=$(echo "$FILE_META" | jq -r '.sha')
          echo "$FILE_META" | jq -r '.content' | base64 -d > /tmp/cocker.rb

          # Patch the placeholder. If absent, nothing to do.
          if ! grep -q REPLACE_BOTTLE_SHA256_ALL /tmp/cocker.rb; then
            echo "No REPLACE_BOTTLE_SHA256_ALL placeholder on main — already patched."
            exit 0
          fi
          sed -i "s|REPLACE_BOTTLE_SHA256_ALL|${SHA_ALL}|" /tmp/cocker.rb

          B64=$(base64 -w0 /tmp/cocker.rb)
          RESP=$(curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/contents/Formula/cocker.rb" \
            -d "$(jq -n \
              --arg msg "chore(bottle): refresh sha256 for ${TAG}" \
              --arg content "$B64" \
              --arg sha "$FILE_SHA" \
              --arg branch "main" \
              '{message:$msg, content:$content, sha:$sha, branch:$branch}')")
          NEW_SHA=$(echo "$RESP" | jq -r '.commit.sha')
          echo "Signed commit on main: $NEW_SHA"
