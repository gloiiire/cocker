name: Bottle

# Build Homebrew bottles for cocker. A "bottle" is a pre-compiled
# binary tarball that brew downloads instead of `swift build` on the
# user's machine — install drops from ~3 min to ~5s.
#
# Strategy : repack the artifacts that the Release workflow already
# uploaded, rather than calling `brew install --build-bottle` (which
# would `swift build` from scratch a SECOND time on each matrix
# entry). The arm64 cocker binary is identical across Sonoma /
# Sequoia / Tahoe — only the tarball's filename (and therefore
# sha256) differs per OS, so we build three named tarballs from one
# Cellar staging dir on a fast Ubuntu runner.
#
# Wins vs. the old `brew install --build-bottle` matrix :
#   - No macOS runner provisioning (~2 min/runner × 3 → 0).
#   - No second `swift build` (~5 min/runner × 3 → 0).
#   - Single Ubuntu job, ~1 min total versus ~15 min.
#
# Triggered AFTER the Release workflow uploads its arm64-macos
# binaries, since we depend on them as source material.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bottle (e.g. v0.5.14.1)'
        required: true

permissions:
  contents: write   # upload bottle assets + push formula update

jobs:
  bottle:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          VER="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout cocker @ tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # No `fetch-depth: 0` — we only need the tag's snapshot, not
          # the history. Saves ~10s on big-repo clones.

      # Pull the binaries the Release workflow already built, signed,
      # and uploaded as release assets. `gh release download` is the
      # built-in CLI for this — no shell-curl-tar dance needed.
      - name: Download Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p artifacts
          cd artifacts
          gh release download "$TAG" \
            --pattern "cocker-${TAG}-arm64-macos" \
            --pattern "cockerd-${TAG}-arm64-macos" \
            --pattern "cocker-portfwd-${TAG}-arm64-macos" \
            --pattern "cocker-mcp-${TAG}-arm64-macos" \
            --pattern "initrd-${TAG}.img"
          ls -la

      # Reconstruct the Cellar layout `brew bottle` would have built,
      # plus the INSTALL_RECEIPT.json that brew requires to recognize
      # the tarball as a valid bottle at pour time. Then tar.gz three
      # named copies (tahoe / sequoia / sonoma) — the bytes are
      # identical but each OS tag needs its own asset because the
      # formula's `bottle do` block matches on filename.
      - name: Assemble Cellar layout
        id: assemble
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${{ steps.tag.outputs.version }}"

          ROOT="bottle-staging/cocker/${VER}"
          mkdir -p "$ROOT/bin" "$ROOT/share/cocker"

          # Drop the v-prefix from binary filenames as they land in
          # ${PREFIX}/bin/. INSTALL_RECEIPT.json + symlinks created by
          # brew at pour time will then point to bare names.
          mv "artifacts/cocker-${TAG}-arm64-macos"         "$ROOT/bin/cocker"
          mv "artifacts/cockerd-${TAG}-arm64-macos"        "$ROOT/bin/cockerd"
          mv "artifacts/cocker-portfwd-${TAG}-arm64-macos" "$ROOT/bin/cocker-portfwd"
          mv "artifacts/cocker-mcp-${TAG}-arm64-macos"     "$ROOT/bin/cocker-mcp"
          chmod +x "$ROOT/bin/"*

          # initrd + entitlements live under share/cocker/ ; they're
          # consumed by post_install + at daemon boot time.
          mv "artifacts/initrd-${TAG}.img" "$ROOT/share/cocker/initrd.img"
          cp "entitlements/cockerd.entitlements" "$ROOT/share/cocker/"

          # Man pages : ship them if the source tarball has them
          # pre-generated under docs/man/, else skip (the formula's
          # source-build path can still regenerate them).
          if [ -d docs/man ]; then
            mkdir -p "$ROOT/share/man/man1"
            cp docs/man/*.1 "$ROOT/share/man/man1/" 2>/dev/null || true
          fi

          # INSTALL_RECEIPT.json — minimum brew accepts to pour the
          # bottle. The fields that actually matter to brew :
          #   - built_as_bottle = true
          #   - source.versions.stable = the formula version
          #   - source.tap = our tap
          #   - arch = arm64
          # built_on.os_version is informational, brew doesn't gate on
          # it. We pin macOS 14.0 (our minimum) so brew never refuses
          # a Sonoma user.
          BUILT_TIME=$(date +%s)
          cat > "$ROOT/INSTALL_RECEIPT.json" <<JSON
          {
            "homebrew_version": "4.0.0",
            "used_options": [],
            "unused_options": [],
            "built_as_bottle": true,
            "poured_from_bottle": false,
            "loaded_from_api": false,
            "installed_as_dependency": false,
            "installed_on_request": true,
            "changed_files": [],
            "time": ${BUILT_TIME},
            "source_modified_time": ${BUILT_TIME},
            "stdlib": null,
            "compiler": "clang",
            "aliases": [],
            "runtime_dependencies": [],
            "source": {
              "spec": "stable",
              "patches": [],
              "tap": "gloiiire/cocker",
              "versions": {
                "stable": "${VER}"
              }
            },
            "arch": "arm64",
            "built_on": {
              "os": "Macintosh",
              "os_version": "macOS 14.0",
              "cpu_family": "arm_vortex_tempest"
            }
          }
          JSON

          # Build three OS-tagged copies. Same bytes inside, different
          # filename → different sha256 of the FILE itself. We use
          # tar -C to enter the staging root so the tarball contains
          # `cocker/<ver>/...` paths exactly as brew expects.
          mkdir -p out
          for os in tahoe sequoia sonoma; do
            NAME="cocker-${TAG}.arm64_${os}.bottle.tar.gz"
            tar -C bottle-staging -czf "out/${NAME}" "cocker/${VER}"
            SHA=$(sha256sum "out/${NAME}" | awk '{print $1}')
            echo "sha_${os}=${SHA}" >> "$GITHUB_OUTPUT"
            echo "Built ${NAME}"
            echo "  sha256 ${SHA}"
          done
          ls -la out/

      - name: Upload bottles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            out/*.bottle.tar.gz --clobber

      # Patch the source formula's bottle do block with the actual
      # sha256s we just computed, commit, push to main. The
      # `sync-homebrew-tap` workflow that fires on this same tag will
      # then carry the patched formula into the user-facing tap repo.
      - name: Rewrite Formula sha256s and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -i "s|REPLACE_BOTTLE_SHA256_TAHOE|${{ steps.assemble.outputs.sha_tahoe }}|"   Formula/cocker.rb
          sed -i "s|REPLACE_BOTTLE_SHA256_SEQUOIA|${{ steps.assemble.outputs.sha_sequoia }}|" Formula/cocker.rb
          sed -i "s|REPLACE_BOTTLE_SHA256_SONOMA|${{ steps.assemble.outputs.sha_sonoma }}|"  Formula/cocker.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Switch to main and rebase the sha256 patch on top — the
          # tag was cut from main, but main may have moved while
          # Release + this workflow ran.
          git fetch origin main --quiet
          git checkout main
          git pull origin main --ff-only --quiet
          git checkout - -- Formula/cocker.rb
          git add Formula/cocker.rb
          if git diff --staged --quiet; then
            echo "No formula change (sha256s already in place ?)"
            exit 0
          fi
          git commit -m "chore(bottle): refresh sha256 for ${{ steps.tag.outputs.tag }}"
          git push origin main
