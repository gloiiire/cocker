name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Annule les runs en cours quand un nouveau commit arrive sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: swift build (debug)
        run: swift build
      - name: swift test + coverage gate (90%)
        # Fails the build if line coverage drops below 90% (ratchet — never
        # go down). Excluded paths (cannot be unit-tested without live
        # infrastructure : VM framework, Unix sockets, kernel networking) :
        #   - OCI/Registry — live HTTPS to Docker Hub
        #   - OCI/ImageStore — touches the filesystem rootfs/blobs layout
        #   - IPC/Transport — Unix socket connect to a running daemon
        #   - VMRuntime — Apple Virtualization.framework, needs real VM
        #   - main.swift — daemon entry point, signal/listener wiring
        #   - L2Switch / DNSVsockListener / PortForwarder — kernel-level
        #     network plumbing, exercised by Sprint 3 live tests only
        #   - DaemonServer — Unix socket accept loop, exercised end-to-end
        #   - DockerAPIServer — HTTP request dispatch, exercised live
        #   - CockerCLI/Commands — ArgumentParser configuration ; correctness
        #     verified by the live smoke tests in Sprint 3 + the
        #     `CLIConfigurationTests` suite
        run: |
          swift test --parallel --enable-code-coverage

          BIN="$(find .build -path '*CockerPackageTests.xctest/Contents/MacOS/CockerPackageTests' | head -1)"
          PROF="$(find .build -name 'default.profdata' | head -1)"
          # Excluded : tests, vendored, generated, plus modules that
          # depend on Apple Virtualization.framework / kernel sockets /
          # registry HTTPS / filesystem rootfs layout. They have full
          # live-test coverage via Sprint 3 smoke tests, but cannot be
          # exercised by the in-process `swift test` runner.
          # 0.5.13.x additions : CLI-side helpers that shell out to rsync
          # / brctl, use FSEvents, or twiddle termios. None can be unit-
          # tested in-process without elaborate FS / subprocess mocks ;
          # real coverage comes from integration smoke runs (compose up
          # on a known iCloud project).
          # 0.6.0 audit additions :
          #   - LeasePoolMonitor : reads /var/db/dhcpd_leases + touches a
          #     /var/run trigger ; not exercisable inside swift test.
          #   - AuditLog : writes ~/.cocker/audit.log with rotation ; the
          #     real coverage comes from the smoke runs.
          # 0.7.0 UX foundation additions :
          #   - Spinner : drives a Task that writes ANSI cursor moves to
          #     stdout in a 80 ms loop ; deterministic testing would require
          #     a fake stdout + clock, not worth the wiring.
          #   - StickyView : same — cursor-up redraw against a real TTY.
          #   - InteractiveFooter : same category as Spinner/StickyView/
          #     InteractiveDetach — cbreak/termios raw mode, a detached stdin
          #     key-reader Task, and StickyView redraw ; the bulk can't run
          #     under the in-process test runner. Its PURE logic (footerLines,
          #     ServiceURLs) IS unit-tested (InteractiveFooterTests) — the
          #     exclusion only spares the terminal-bound glue.
          # EngineOperations was extracted from ContainerEngine without changing
          # behavior. It owns the same VM/filesystem integration paths, so keep
          # the coverage boundary stable instead of counting moved code as 0%.
          IGNORE='(\.build/|Tests/|cocker-init/|OCI/Registry|OCI/ImageStore|IPC/Transport|CockerDaemon/Engine/VMRuntime|CockerDaemon/Engine/ContainerEngine|CockerDaemon/Engine/EngineOperations|CockerDaemon/Engine/ImageManager|CockerDaemon/Engine/Ext4Image|CockerDaemon/Engine/NetworkManager|CockerDaemon/Engine/PortForwarder|CockerDaemon/Engine/LeasePoolMonitor|CockerDaemon/Engine/AuditLog|CockerDaemon/DNS/DNSServer|CockerDaemon/Network/|CockerDaemon/Server/DaemonServer|CockerDaemon/API/DockerAPIServer|CockerDaemon/API/DockerAPITLSListener|CockerDaemon/Compose/ComposeEngine|CockerDaemon/main\.swift|CockerCLI/Commands/|CockerCLI/Output/|CockerCLI/CockerCLI\.swift|CockerCLI/ICloudStaging\.swift|CockerCLI/ICloudInspector\.swift|CockerCLI/InteractiveDetach\.swift|CockerCLI/UX/Spinner\.swift|CockerCLI/UX/StickyView\.swift|CockerCLI/UX/InteractiveFooter\.swift)'

          xcrun llvm-cov report "$BIN" -instr-profile="$PROF" \
            -ignore-filename-regex="$IGNORE" \
            | tee coverage.txt

          # Extract the TOTAL line coverage percentage (last column after lines column)
          COV=$(awk '/^TOTAL/ { gsub("%","",$10); print $10 }' coverage.txt)
          echo "Line coverage: ${COV}%"
          # Use python for float comparison so we don't depend on bc
          MEET=$(python3 -c "print('yes' if float('${COV}') >= 90 else 'no')")
          if [ "$MEET" != "yes" ]; then
            echo "::error::Line coverage ${COV}% < 90% threshold"
            exit 1
          fi
          {
            echo '## Test coverage'
            echo ''
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  swift-build-release:
    name: Swift build release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-release-${{ hashFiles('Package.resolved') }}
          # Partial-match fallback so a deps-only change still benefits
          # from the previous toolchain's module cache (saves ~3 min).
          restore-keys: |
            ${{ runner.os }}-spm-release-
            ${{ runner.os }}-spm-
      - name: swift build -c release
        # Vérifie que cocker + cockerd compilent en release.
        # Le code signing virtualization est fait à l'install via Homebrew.
        run: swift build -c release
      - name: Verify binaries exist
        run: |
          test -f .build/release/cocker || { echo "❌ cocker binary missing"; exit 1; }
          test -f .build/release/cockerd || { echo "❌ cockerd binary missing"; exit 1; }
          file .build/release/cocker
          file .build/release/cockerd

  cocker-init-build:
    name: cocker-init (Linux ARM64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install zig
        run: brew install zig
      - name: Cross-compile cocker-init
        # cocker-init est un binaire C statique pour Linux ARM64,
        # cross-compilé via zig cc depuis macOS. Il sert d'init (PID 1)
        # dans les VMs container. Inclut l'exec listener (vsock) et la
        # gestion des capabilities ajoutées en Sprint 2/3.
        working-directory: cocker-init
        run: zig cc -target aarch64-linux-musl -static -O2 -Wall -o cocker-init init.c cmdline.c net.c dns_proxy.c spec.c qemu.c exec_listener.c caps.c health_poll.c etc_overlay.c dhcp_min.c
      - name: Verify ELF
        working-directory: cocker-init
        run: |
          file cocker-init | grep -q "ELF 64-bit.*ARM aarch64" || { echo "❌ wrong arch"; exit 1; }
          echo "✅ cocker-init cross-compiled for Linux ARM64"
      - name: Build fuzz harness (ASAN sanity)
        # P5 — build the standalone exec_listener fuzz target with
        # ASAN enabled. This is a build-time sanity check ; the actual
        # fuzz campaign runs locally (libFuzzer + a corpus). Catching
        # compile-time regressions here keeps the harness usable.
        working-directory: cocker-init
        run: |
          clang -g -O1 -fsanitize=address -Wall -Werror \
            tests/fuzz_exec_parser.c -o /tmp/fuzz_exec_parser_sanity
          echo "✅ fuzz harness builds clean with ASAN"
      - name: Exec parser ordering test
        # Correctness (not just crash-safety) : the exec JSON scanner must
        # recover cmd / env / tty for ALL six key orderings — JSONEncoder's
        # key order is randomized per daemon process, and an order-dependent
        # parser silently dropped the PTY (`exec -it`) or the environment.
        working-directory: cocker-init
        run: |
          clang -g -O1 -fsanitize=address -Wall -Werror \
            tests/test_exec_parser_order.c -o /tmp/test_exec_parser_order
          /tmp/test_exec_parser_order

  e2e-lint:
    name: e2e scripts syntax check
    # A9 — full e2e suite requires a real Mac with Virtualization.framework
    # which GitHub's macos-15 runners can't provide. The closest CI-safe
    # signal is a syntax check : catches broken shell long before a
    # maintainer ships a regression that quietly fails at run time.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Lint shell scripts
        working-directory: Tests/e2e
        run: |
          set -e
          for s in *.sh; do
            echo "  → bash -n $s"
            bash -n "$s"
          done
          echo "✅ all e2e scripts parse"

  audit:
    name: SwiftPM dependency audit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve dependencies
        run: swift package resolve
      - name: List dependencies
        # Affiche l'arbre de dépendances. Dependabot gère les CVE alerts
        # côté GitHub; ce job garantit que Package.resolved est cohérent
        # avec Package.swift et catch les drifts à la PR.
        run: swift package show-dependencies
      - name: Verify Package.resolved committed and clean
        run: |
          if [ -n "$(git status --porcelain Package.resolved)" ]; then
            echo "❌ Package.resolved drifted from Package.swift"
            git diff Package.resolved
            exit 1
          fi
          echo "✅ Package.resolved is in sync"

  lint:
    name: Swift lint (formatting)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install swift-format
        # swift-format est intégré à Xcode 16+, on l'invoque directement.
        run: which swift-format || brew install swift-format
      - name: Check formatting
        # Mode --strict: échoue sur la moindre divergence de style.
        # Ne bloque PAS la build initialement — warning only — pour ne pas
        # casser la CI pendant qu'on stabilise la base. Retirer le `|| true`
        # quand le code est formaté.
        run: swift-format lint --recursive Sources/ Tests/ || true

  sbom:
    name: Software Bill of Materials (syft)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Install syft
        run: |
          if ! command -v syft >/dev/null 2>&1; then
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          fi
          syft version
      - name: Generate SBOM (CycloneDX) for the repo
        run: |
          syft scan dir:. -o cyclonedx-json=sbom.cdx.json -o spdx-json=sbom.spdx.json
          echo "## SBOM (top-level Swift packages)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          syft scan dir:. -o table | head -30 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json

  vuln-scan:
    name: Vulnerability scan (trivy)
    runs-on: macos-15
    needs: sbom
    steps:
      - uses: actions/checkout@v6
      - name: Install trivy
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            brew install trivy
          fi
          trivy --version
      - name: Scan repository (config + secrets + dependencies)
        # Fails on HIGH or CRITICAL findings. Skip license check for now,
        # adopt later when we have a license policy.
        run: |
          trivy fs --severity HIGH,CRITICAL \
                   --scanners vuln,secret,misconfig \
                   --exit-code 1 \
                   --skip-dirs .build,.git,Tests/CockerTests \
                   . | tee trivy.txt
          {
            echo '## Trivy scan (HIGH + CRITICAL)'
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: trivy.txt

  smoke:
    # Build, sign and package everything the way a release does — but do
    # NOT pretend to run containers here.
    #
    # Measured on a hosted macos-15 runner (.github/workflows/vm-probe.yml) :
    #
    #   chip                          = Apple M1 (Virtual)
    #   kern.hv_vmm_present           = 1     ← the runner is itself a VM
    #   nestedVirtualizationSupported = false ← nested virt needs M3+
    #   VZVirtualMachineConfiguration.validate()
    #     → VZErrorDomain Code=2 "Virtualization is not available on this hardware."
    #
    # Booting a guest from inside a VM requires nested virtualization,
    # which Apple ships only on M3 and later (macOS 15+). GitHub's macOS
    # fleet is M1/M2, and GitHub documents nested virtualization as "not
    # officially supported". So no amount of Xcode/CLI tooling can make
    # this job boot a container : the limit is hardware, not software.
    #
    # This job therefore validates exactly what a hosted runner CAN :
    # compilation, cocker-init cross-build, initrd packing, and code
    # signing with the virtualization entitlement. Real container
    # behaviour is covered by `Tests/e2e/run-all.sh`, which a maintainer
    # runs on real hardware before tagging.
    #
    # It used to end with a green check while silently skipping the whole
    # container part, which is worse than not running it at all : four
    # e2e scenarios were red for months behind that check.
    name: build + package (no VM on hosted runners)
    runs-on: macos-15
    needs: [swift-tests, swift-build-release, cocker-init-build]
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install zig (for cocker-init)
        run: brew install zig
      - name: Build everything
        run: |
          swift build -c release
          cd cocker-init
          zig cc -target aarch64-linux-musl -static -O2 -Wall \
            -o cocker-init init.c cmdline.c net.c dns_proxy.c qemu.c spec.c exec_listener.c caps.c health_poll.c etc_overlay.c dhcp_min.c
          cp cocker-init initrd-staging/init
          (cd initrd-staging && find . | cpio -o -H newc 2>/dev/null) | gzip -9 > ../initrd.img
      - name: Sign cockerd with entitlements
        run: |
          codesign --force --sign - \
            --entitlements entitlements/cockerd.entitlements \
            .build/release/cockerd
      # Everything below is a real assertion : it fails the job when the
      # artefact a release ships is wrong. That is the whole point — the
      # previous version of this job could pass while producing nothing.
      - name: Entitlement is actually embedded
        # The release binary is useless without it : cockerd refuses to
        # boot any VM. Cheap to check, catastrophic to get wrong.
        run: |
          codesign -d --entitlements - .build/release/cockerd 2>&1 \
            | tee /tmp/ents.txt
          grep -q 'com.apple.security.virtualization' /tmp/ents.txt \
            || { echo "::error::virtualization entitlement missing from cockerd"; exit 1; }
      - name: initrd contains the freshly built cocker-init
        # This is the exact packaging bug that shipped in 0.7.13.13 : the
        # workflow rebuilt cocker-init, then copied a stale initrd.img
        # tracked in git, so the fix never reached users.
        run: |
          cd cocker-init
          mkdir -p /tmp/initrd-check && cd /tmp/initrd-check
          gzip -dc "$GITHUB_WORKSPACE/cocker-init/initrd.img" | cpio -id --quiet
          test -f init || { echo "::error::initrd.img has no /init"; exit 1; }
          if ! cmp -s init "$GITHUB_WORKSPACE/cocker-init/cocker-init"; then
            echo "::error::initrd.img does not contain the cocker-init just built"
            exit 1
          fi
          echo "initrd.img carries the freshly built cocker-init ✅"
      - name: CLI runs without a daemon
        # Catches a binary that cannot even start (bad link, missing dylib)
        # without needing a VM.
        run: |
          ./.build/release/cocker --version
          ./.build/release/cockerd --version
      - name: Why no container test here
        run: |
          echo "Hosted macOS runners are M1/M2 VMs (kern.hv_vmm_present=1) and"
          echo "Apple only offers nested virtualization on M3+. Virtualization"
          echo "framework reports: 'Virtualization is not available on this"
          echo "hardware.' See .github/workflows/vm-probe.yml for the measurement."
          echo
          echo "Container behaviour is covered by Tests/e2e/run-all.sh, run on"
          echo "real hardware before tagging a release."
