name: Branch policy

on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    name: Enforce promotion chain
    runs-on: ubuntu-latest
    steps:
      - name: PRs to main must come from dev
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "❌ PRs to main must come from dev (got: ${{ github.head_ref }})"
          exit 1

      - name: OK
        run: echo "✅ Source branch is valid"
